<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>DevOps Platform</h1>

    <p>Frontend → Backend API</p>

    <button onclick="checkHealth()">Check Backend</button>

    <div class="card">
        <h2>Backend status</h2>
        <pre id="result">Waiting...</pre>
    </div>

    <script>
        async function checkHealth() {
            const result = document.getElementById("result");

            try {
                const response = await fetch("http://localhost:5000/health");
                const data = await response.json();

                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = "Backend unavailable";
            }
        }
    </script>

</body>
</html>
